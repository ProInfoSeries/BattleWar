<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BattleWarSettings</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .settings-title {
      text-align: center;
      margin: 40px 0 20px;
      font-size: 32px;
      color: white;
    }

    .settings-tabs {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    .tab-btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .tab-btn:hover {
      background-color: #555;
    }

    .tab-btn.active-tab {
      background-color: #0a84ff;
    }

    .triangle-back {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .triangle-btn {
      width: 100px;
      height: 60px;
      background-color: #444;
      color: white;
      font-weight: bold;
      border: none;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
    }

    .triangle-btn:hover {
      background-color: #666;
    }

    .settings-panel {
      display: none;
      background-color: #222;
      border: 2px solid #555;
      border-radius: 8px;
      padding: 20px;
      margin: 20px auto;
      width: 80%;
      color: white;
      box-sizing: border-box;
    }

    .settings-panel.active-panel {
      display: block !important;
    }

    .utility-panel {
      background-color: #222;
      border: 2px solid #555;
      border-radius: 8px;
      padding: 20px;
      margin: 20px auto;
      width: 80%;
      color: white;
      box-sizing: border-box;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .setting-row label {
      font-weight: bold;
      font-size: 16px;
      flex: 1;
      min-width: 150px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex: 2;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .setting-btn {
      padding: 8px 16px;
      font-weight: bold;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .setting-btn:hover {
      background-color: #666;
    }

    .setting-btn.selected {
      background-color: #0a84ff;
      color: white;
    }

    .ai-choice-row {
      display: flex;
      justify-content: space-around;
      gap: 20px;
      margin-top: 10px;
      flex-wrap: wrap;
      width: 100%;
    }

    .ai-card {
      text-align: center;
      flex: 1;
      min-width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ai-thumbnail {
      width: 100px;
      height: 100px;
      background-color: #333;
      border: 2px solid #666;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }

    .more-settings-label {
      font-size: 20px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      margin-bottom: 10px;
      text-align: center;
    }

    .save-load-label {
      font-size: 20px;
      font-weight: bold;
      color: white;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

<h1 class="settings-title">Settings</h1>

<div class="settings-tabs">
  <button class="tab-btn active-tab" onclick="switchTab(this, 'panel-online')">Online</button>
  <button class="tab-btn" onclick="switchTab(this, 'panel-fire')">Fire</button>
  <button class="tab-btn" onclick="switchTab(this, 'panel-explosion')">Explosion</button>
  <button class="tab-btn" onclick="switchTab(this, 'panel-weapon')">Weapon</button>
  <button class="tab-btn" onclick="switchTab(this, 'panel-ai')">AI</button>
</div>

<div class="triangle-back">
  <a href="index.html" class="triangle-btn">Back</a>
</div>

<div id="panel-online" class="settings-panel active-panel">
  <div class="setting-row">
    <label>Connection Rate:</label>
    <div class="button-group">
      <button class="setting-btn">1 (>30 FPS)</button>
      <button class="setting-btn">2 (30-120 FPS)</button>
      <button class="setting-btn">3 or Higher (120+ FPS)</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Choose Regionally?</label>
    <div class="button-group">
      <button class="setting-btn">Yes</button>
      <button class="setting-btn">No</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Random Difficulty?</label>
    <div class="button-group">
      <button class="setting-btn">Yes</button>
      <button class="setting-btn">No</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Friendly Fire?</label>
    <div class="button-group">
      <button class="setting-btn">Yes</button>
      <button class="setting-btn">No</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Able to Surrender Mid-Game?</label>
    <div class="button-group">
      <button class="setting-btn">Yes</button>
      <button class="setting-btn">No</button>
    </div>
  </div>
</div>

<div id="panel-fire" class="settings-panel">

    <div class="button-group">

    </div>
  </div>

  <div class="setting-row">
    <label>Fire Spreads?</label>
    <div class="button-group">
      <button class="setting-btn">Yes</button>
      <button class="setting-btn">Not for me</button>

  </div>

  <div class="setting-row">
    <label>Fire Spread Rate:</label>
    <div class="button-group">
      <button class="setting-btn">0.25</button>
      <button class="setting-btn">0.5</button>
      <button class="setting-btn">1</button>
      <button class="setting-btn">2</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Fire Damage:</label>
    <div class="button-group">
      <button class="setting-btn">1</button>
      <button class="setting-btn">2</button>
      <button class="setting-btn">3</button>
      <button class="setting-btn">4</button>
      <button class="setting-btn">5</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Fire Effect:</label>
    <div class="button-group">
      <button class="setting-btn">Visible</button>
      <button class="setting-btn">Opaque</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Should Fire Even Exist?</label>
    <div class="button-group">
      <button class="setting-btn">Yes</button>
      <button class="setting-btn">NO!</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Tree Catches Fire?</label>
    <div class="button-group">
      <button class="setting-btn">Yes</button>
      <button class="setting-btn">Ack so scary, no!</button>
    </div>
  </div>
</div>

<div id="panel-explosion" class="settings-panel">
  <div class="setting-row">
    <label>Explosion Lengthtivity:</label>
    <div class="button-group">
      <button class="setting-btn">5</button>
      <button class="setting-btn">10</button>
      <button class="setting-btn">20</button>
      <button class="setting-btn">50</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Explosion Shrink Rate:</label>
    <div class="button-group">
      <button class="setting-btn">0.5</button>
      <button class="setting-btn">1</button>
      <button class="setting-btn">2</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Landmine Range:</label>
    <div class="button-group">
      <button class="setting-btn">2</button>
      <button class="setting-btn">3</button>
      <button class="setting-btn">4</button>
      <button class="setting-btn">5</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Missile Blast Range:</label>
    <div class="button-group">
      <button class="setting-btn">2</button>
      <button class="setting-btn">5</button>

      <button class="setting-btn">15</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Flak Explosion Range:</label>
    <div class="button-group">
      <button class="setting-btn">3</button>
      <button class="setting-btn">4</button>
      <button class="setting-btn">5</button>
      <button class="setting-btn">10</button>
      <button class="setting-btn">The whole sky</button>
    </div>
  </div>
</div>

<div id="panel-weapon" class="settings-panel">
  <div class="setting-row">
    <label>Cannon Range:</label>
    <div class="button-group">
      <button class="setting-btn">0.25</button>
      <button class="setting-btn">0.5</button>
      <button class="setting-btn">1</button>
      <button class="setting-btn">2</button>
      <button class="setting-btn">2.5</button>
      <button class="setting-btn">3</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Effect?</label>
    <div class="button-group">
      <button class="setting-btn">Visible</button>
      <button class="setting-btn">Opaque</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Explosions:</label>
    <div class="button-group">
      <button class="setting-btn">Yes</button>
      <button class="setting-btn">NO!</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Damage Done:</label>
    <div class="button-group">
      <button class="setting-btn">3</button>

    </div>
  </div>

  <div class="setting-row">

      <button class="setting-btn">0.5</button>
      <button class="setting-btn">1</button>
      <button class="setting-btn">2</button>
      <button class="setting-btn">3</button>

  <div class="setting-row">

  </div>

  <div class="setting-row">
    <label>Missile Range:</label>
    <div class="button-group">
      <button class="setting-btn">2</button>
      <button class="setting-btn">4</button>
      <button class="setting-btn">6</button>

      <button class="setting-btn">10</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Gunfire Scope:</label>
    <div class="button-group">
      <button class="setting-btn">0.1</button>

      <button class="setting-btn">0.7</button>
      <button class="setting-btn">1</button>

  </div>
</div>

<div id="panel-ai" class="settings-panel">
  <div class="setting-row">
    <label>Counter-Tactics:</label>

      <button class="setting-btn">High use</button>
      <button class="setting-btn">Low use</button>

  </div>

  <div class="setting-row">
    <label>AI HP Buff ×0.5:</label>

      <button class="setting-btn">Yes</button>
      <button class="setting-btn">No</button>

  </div>

  <div class="setting-row">
    <label>AI Mistake Correction:</label>

      <button class="setting-btn">No</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Aggressiveness Change by Gameplay:</label>
    <div class="button-group">
      <button class="setting-btn">Yes</button>
      <button class="setting-btn">No</button>
    </div>
  </div>

  <div class="setting-row">
    <label>AI Pitying?</label>
    <div class="button-group">
      <button class="setting-btn">Yes</button>
      <button class="setting-btn">No</button>
    </div>
  </div>

  <div class="setting-row">
    <label>Choose AI:</label>
    <div class="button-group ai-choice-row">
      <div class="ai-card">
        <div class="ai-thumbnail">[Thumbnail]</div>
        <button class="setting-btn">Simpleton</button>
      </div>
      <div class="ai-card">
        <div class="ai-thumbnail">[Thumbnail]</div>
        <button class="setting-btn">General Harold</button>
      </div>
      <div class="ai-card">
        <div class="ai-thumbnail">[Thumbnail]</div>
        <button class="setting-btn">Commander Ava</button>
      </div>
    </div>
  </div>
</div>

<div class="utility-panel">
  <h2 class="more-settings-label" onclick="toggleDropdown()">More Settings ▼</h2>

  <div id="moreSettingsDropdown" style="display:none;">
    <div class="setting-row">
      <button class="setting-btn" style="width:100%; cursor:default;">Water Settings (Impossible Pack Only)</button>
    </div>

    <div id="waterSettings" style="display:none; margin-top: 20px;">
      <div class="setting-row">
        <label>Water Density:</label>
        <div class="button-group">
          <button class="setting-btn">100</button>
          <button class="setting-btn">200</button>
          <button class="setting-btn">500</button>
        </div>
      </div>

      <div class="setting-row">
        <label>Bubbles?</label>
        <div class="button-group">
          <button class="setting-btn">Yes</button>
          <button class="setting-btn">No</button>
        </div>
      </div>

      <div class="setting-row">
        <label>Pressure:</label>
        <div class="button-group">
          <button class="setting-btn">2K</button>
          <button class="setting-btn">4K</button>
          <button class="setting-btn">8K</button>
        </div>
      </div>

      <div class="setting-row">
        <label>Water Heat Up?</label>
        <div class="button-group">
          <button class="setting-btn">Yes</button>
          <button class="setting-btn">No</button>
        </div>
      </div>

      <div class="setting-row">
        <label>AI Water Advantage?</label>
        <div class="button-group">
          <button class="setting-btn">Low</button>
          <button class="setting-btn">High</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="utility-panel">
  <h2 class="save-load-label">Save & Load Settings</h2>

  <div class="setting-row" style="justify-content: center; gap: 10px;">
    <button class="setting-btn" onclick="saveSettings()">💾 Save Settings</button>
    <button class="setting-btn" onclick="loadSettings()">📂 Load Settings</button>
    <button class="setting-btn" onclick="resetSettings()">🔄 Reset to Defaults</button>
  </div>
</div>

<script>
function switchTab(buttonElement, targetPanelId) {
  const panels = document.querySelectorAll('.settings-panel');
  panels.forEach(panel => panel.classList.remove('active-panel'));

  const tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach(tab => tab.classList.remove('active-tab'));

  const targetPanel = document.getElementById(targetPanelId); 
  if (targetPanel) {
    targetPanel.classList.add('active-panel');
  }
  buttonElement.classList.add('active-tab');
}

function toggleDropdown() {
  const dropdown = document.getElementById('moreSettingsDropdown');
  dropdown.style.display = (dropdown.style.display === 'none' || dropdown.style.display === '') ? 'block' : 'none';
}

document.querySelectorAll('.button-group').forEach(group => {
  group.addEventListener('click', (e) => {
    if (e.target.classList.contains('setting-btn')) {
      const buttons = group.querySelectorAll('.setting-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));
      e.target.classList.add('selected');
    }
  });
});

// im very terrible at coding, will add in the logic soon
let impossiblePackUnlocked = true;

if (impossiblePackUnlocked) {
  document.addEventListener("DOMContentLoaded", () => {
    const waterElem = document.getElementById('waterSettings');
    if (waterElem) waterElem.style.display = 'block';
  });
}

function saveSettings() {
  const buttons = document.querySelectorAll('.button-group .setting-btn');
  const settings = {};
  buttons.forEach(btn => {
    if (btn.classList.contains('selected')) {
      const label = btn.closest('.setting-row')?.querySelector('label')?.textContent.trim() || 'misc';
      settings[label] = btn.textContent.trim();
    }
  });
  localStorage.setItem('battlewarSettings', JSON.stringify(settings));
  alert('Settings saved!');
}

function loadSettings() {
  const saved = JSON.parse(localStorage.getItem('battlewarSettings') || '{}');
  document.querySelectorAll('.button-group .setting-btn').forEach(btn => {
    const label = btn.closest('.setting-row')?.querySelector('label')?.textContent.trim() || 'misc';
    if (saved[label] === btn.textContent.trim()) {
      btn.classList.add('selected');
    } else {
      btn.classList.remove('selected');
    }
  });
  alert('Settings loaded!');
}

function resetSettings() {
  localStorage.removeItem('battlewarSettings');
  document.querySelectorAll('.button-group .setting-btn').forEach(btn => btn.classList.remove('selected'));
  alert('Settings reset to defaults.');
}
</script>

</body>
</html>
