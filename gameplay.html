<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BattleWar Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0d12;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    .hud-bar {
      width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
      background: #181c24;
      padding: 10px 18px;
      border-radius: 6px;
      box-sizing: border-box;
      border: 1px solid #2a3242;
    }

    #game-canvas {
      background-color: #121824;
      border: 2px solid #3a4659;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.9);
    }

    .controls-hint {
      margin-top: 14px;
      font-size: 14px;
      color: #8a9bb8;
    }

    .status-text {
      color: #ffcc00;
    }
  </style>
</head>
<body>

  <div class="hud-bar">
    <div>Side: <span id="side-indicator" style="color: #0a84ff;">LEFT</span></div>
    <div>Active Unit: <span id="asset-indicator" class="status-text">Tank Alpha</span></div>
    <div>Mode: <span id="mode-indicator" style="color: #00ff88;">NAVIGATING</span></div>
    <div>Wind: <span id="wind-indicator" style="color: #00d2ff;">0.0</span></div>
  </div>

  <canvas id="game-canvas" width="960" height="540"></canvas>

  <div class="controls-hint">
    <strong>[Q]</strong> Toggle Select / Aim Mode &nbsp;|&nbsp; 
    <strong>[WASD in Select Mode]</strong> Switch to asset in that direction &nbsp;|&nbsp; 
    <strong>[WASD in Aim Mode]</strong> Aim angle & power &nbsp;|&nbsp; 
    <strong>[Q in Aim Mode]</strong> Fire!
  </div>

  <script>

    const selectedNation = localStorage.getItem('selectedNation') || 'United States';
const NATION_THEMES = {
  'United States': { color: '#0a84ff', flagBg: '#b22234', flagSymbol: '#ffffff', name: 'US' },
  'Third Reiche': { color: '#7f8c8d', flagBg: '#333333', flagSymbol: '#ffffff', name: 'German' },
  'Soviet Unitions': { color: '#c0392b', flagBg: '#cc0000', flagSymbol: '#ffcc00', name: 'Soviet' },
  'Great Britain': { color: '#27ae60', flagBg: '#00247d', flagSymbol: '#cf142b', name: 'British' },
  'Japan': { color: '#bdc3c7', flagBg: '#ffffff', flagSymbol: '#bc002d', name: 'Japanese' },
  'Sweden': { color: '#f1c40f', flagBg: '#006aa7', flagSymbol: '#fecc00', name: 'Swedish' }
};
const NATION_THEMES = {
  // Old Nations
  'French Bourbonate': { color: '#0055a5', name: 'French' },
  'Great Britain': { color: '#27ae60', name: 'British' },
  'Confederatia Helvetica': { color: '#e74c3c', name: 'Swiss' },

  // War-Time
  'Third Reiche': { color: '#7f8c8d', name: 'German' },
  'Soviet Unitions': { color: '#c0392b', name: 'Soviet' },
  'Denmark': { color: '#e67e22', name: 'Danish' },
  'Sweden': { color: '#f1c40f', name: 'Swedish' },
  'Nederlaand': { color: '#d35400', name: 'Dutch' },

  // Others
  'United States': { color: '#0a84ff', name: 'US' },
  'Japan': { color: '#bdc3c7', name: 'Japanese' },
  'DPRK': { color: '#16a085', name: 'NKorea' },
  'ROK': { color: '#2980b9', name: 'SKorea' },
  'Vietnam': { color: '#f39c12', name: 'Vietnamese' }
};

const playerColor = NATION_COLORS[selectedNation] || '#0a84ff';
   
const MAP_THEMES = {
  'Berlin – 1945': { dirtColor: '#3d2817', topColor: '#4e782e', skyColor: '#121824', heightFn: (x) => 380 + Math.sin(x * 0.008) * 50 },
  'Syria – 2024': { dirtColor: '#8c6239', topColor: '#d4a359', skyColor: '#1e1b18', heightFn: (x) => 360 + Math.sin(x * 0.015) * 80 },
  'Moskau – 1941': { dirtColor: '#64748b', topColor: '#e2e8f0', skyColor: '#0f172a', heightFn: (x) => 370 + Math.sin(x * 0.01) * 60 },
  'Viet Dai/Nam – 1970': { dirtColor: '#2b3a1a', topColor: '#386619', skyColor: '#111a10', heightFn: (x) => 350 + Math.sin(x * 0.02) * 90 }
};


const selectedMapName = localStorage.getItem('selectedMap') || 'Berlin – 1945';
const selectedDifficulty = localStorage.getItem('selectedDifficulty') || 'Normal';


this.mapTheme = MAP_THEMES[selectedMapName] || MAP_THEMES['Berlin – 1945'];
    const MODES = { NAVIGATING: 'NAVIGATING', AIMING: 'AIMING', FIRING: 'FIRING' };

    class BattleWarEngine {
      constructor(canvasId) {
        this.mainCanvas = document.getElementById(canvasId);
        this.mainCtx = this.mainCanvas.getContext('2d');

        this.terrainCanvas = document.createElement('canvas');
        this.terrainCanvas.width = this.mainCanvas.width;
        this.terrainCanvas.height = this.mainCanvas.height;
        this.terrainCtx = this.terrainCanvas.getContext('2d');

        this.playerSide = 'LEFT';
        this.mode = MODES.NAVIGATING;
        this.wind = (Math.random() - 0.5) * 20;

        this.selectedAssetIndex = 0;
        this.projectiles = [];
        this.explosions = [];
        this.keys = {};
        this.lastTime = 0;

        this.generateOffscreenTerrain();

        this.assets = [
          { id: 1, name: 'Tank Alpha', x: 100, y: 100, side: 'LEFT', angle: 45, power: 120, color: '#0a84ff' },
          { id: 2, name: 'Tank Bravo', x: 240, y: 100, side: 'LEFT', angle: 45, power: 130, color: '#0a84ff' },
          { id: 3, name: 'Artillery Charlie', x: 380, y: 100, side: 'LEFT', angle: 50, power: 140, color: '#0a84ff' },
          { id: 4, name: 'Enemy Outpost 1', x: 720, y: 100, side: 'RIGHT', angle: 135, power: 120, color: '#ff3b30' },
          { id: 5, name: 'Enemy Outpost 2', x: 860, y: 100, side: 'RIGHT', angle: 135, power: 120, color: '#ff3b30' }
        ];

        this.assets.forEach(a => this.snapAssetToGround(a));

        this.initInput();
        this.updateHUD();
        requestAnimationFrame((ts) => this.loop(ts));
      }

      generateOffscreenTerrain() {
        const ctx = this.terrainCtx;
        const width = this.terrainCanvas.width;
        const height = this.terrainCanvas.height;

        ctx.clearRect(0, 0, width, height);

        ctx.fillStyle = '#3d2817';
        ctx.beginPath();
        ctx.moveTo(0, height);

        for (let x = 0; x <= width; x++) {
          let terrainY = 380 + Math.sin(x * 0.008) * 50 + Math.sin(x * 0.02) * 20;
          ctx.lineTo(x, terrainY);
        }

        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#4e782e';
        ctx.lineWidth = 6;
        ctx.stroke();
      }

      isSolidPixel(x, y) {
        if (x < 0 || x >= this.terrainCanvas.width || y < 0 || y >= this.terrainCanvas.height) {
          return false;
        }
        const pixel = this.terrainCtx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
        return pixel[3] > 0; 
      }

      snapAssetToGround(asset) {
        let testY = 0;
        while (testY < this.mainCanvas.height && !this.isSolidPixel(asset.x, testY)) {
          testY++;
        }
        asset.y = testY - 2;
      }

      explode(x, y, radius) {
        const ctx = this.terrainCtx;
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      initInput() {
        window.addEventListener('keydown', (e) => {
          this.keys[e.code] = true;

          if (e.code === 'KeyQ') {
            this.handleQPress();
          }

          if (this.mode === MODES.NAVIGATING && ['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
            this.navigateAssetDirectionally(e.code);
          }
        });

        window.addEventListener('keyup', (e) => {
          this.keys[e.code] = false;
        });
      }

      handleQPress() {
        if (this.mode === MODES.NAVIGATING) {
          this.mode = MODES.AIMING;
        } else if (this.mode === MODES.AIMING) {
          this.fireActiveAsset();
          this.mode = MODES.FIRING;
        }
      }

      navigateAssetDirectionally(keyCode) {
        const current = this.getActiveAsset();
        const playerAssets = this.assets.filter(a => a.side === this.playerSide);

        let bestMatch = null;
        let minDistance = Infinity;

        playerAssets.forEach(candidate => {
          if (candidate === current) return;

          const dx = candidate.x - current.x;
          const dy = candidate.y - current.y;

          let isMatch = false;
          if (keyCode === 'KeyD' && dx > 20) isMatch = true;
          if (keyCode === 'KeyA' && dx < -20) isMatch = true;
          if (keyCode === 'KeyW' && dy < -10) isMatch = true;
          if (keyCode === 'KeyS' && dy > 10) isMatch = true;

          if (isMatch) {
            const dist = Math.hypot(dx, dy);
            if (dist < minDistance) {
              minDistance = dist;
              bestMatch = candidate;
            }
          }
        });

        if (bestMatch) {
          this.selectedAssetIndex = playerAssets.indexOf(bestMatch);
        }
      }

      getActiveAsset() {
        const playerAssets = this.assets.filter(a => a.side === this.playerSide);
        return playerAssets[this.selectedAssetIndex] || playerAssets[0];
      }

      fireActiveAsset() {
        const asset = this.getActiveAsset();
        const rad = (asset.angle * Math.PI) / 180;
        const velocity = asset.power * 4.2;

        this.projectiles.push({
          x: asset.x,
          y: asset.y - 12,
          vx: Math.cos(rad) * velocity,
          vy: -Math.sin(rad) * velocity
        });
      }

      update(dt) {
        const currentAsset = this.getActiveAsset();

        if (this.mode === MODES.AIMING) {
          if (this.keys['KeyW']) currentAsset.angle = Math.min(180, currentAsset.angle + 30 * dt);
          if (this.keys['KeyS']) currentAsset.angle = Math.max(0, currentAsset.angle - 30 * dt);
          if (this.keys['KeyD']) currentAsset.power = Math.min(250, currentAsset.power + 60 * dt);
          if (this.keys['KeyA']) currentAsset.power = Math.max(10, currentAsset.power - 60 * dt);
        }

        this.assets.forEach(asset => {
          if (!this.isSolidPixel(asset.x, asset.y + 2) && asset.y < this.mainCanvas.height - 20) {
            asset.y += 60 * dt;
          }
        });

        // Projectile physics
const gravity = 140;
for (let i = this.projectiles.length - 1; i >= 0; i--) {
  let p = this.projectiles[i];

  p.vx += this.wind * dt;
  p.vy += gravity * dt;

  p.x += p.vx * dt;
  p.y += p.vy * dt;

  const hitTerrain = this.isSolidPixel(p.x, p.y);

  const isOutOfBounds = 
    p.y < -800 || 
    p.x < -100 || 
    p.x > this.mainCanvas.width + 100 || 
    p.y >= this.mainCanvas.height;

  if (hitTerrain || isOutOfBounds) {
    if (hitTerrain && p.x >= 0 && p.x <= this.mainCanvas.width) {
      const blastRadius = 28;
      this.explosions.push({ x: p.x, y: p.y, radius: 4, alpha: 1 });
      this.explode(p.x, p.y, blastRadius);
    }

    this.projectiles.splice(i, 1);
    this.mode = MODES.NAVIGATING;
  }
}

        for (let i = this.explosions.length - 1; i >= 0; i--) {
          let exp = this.explosions[i];
          exp.radius += 50 * dt;
          exp.alpha -= 1.5 * dt;
          if (exp.alpha <= 0) this.explosions.splice(i, 1);
        }

        this.updateHUD();
      }

      render() {
  // Clear Sky & Render Terrain
  this.mainCtx.fillStyle = this.mapTheme ? this.mapTheme.skyColor : '#121824';
  this.mainCtx.fillRect(0, 0, this.mainCanvas.width, this.mainCanvas.height);
  this.mainCtx.drawImage(this.terrainCanvas, 0, 0);

  const activeAsset = this.getActiveAsset();
  const time = Date.now() * 0.005; // Drives gentle waving animation

  this.assets.forEach(asset => {
    // Determine flag colors based on nation theme
    const theme = NATION_THEMES[asset.nation] || { flagBg: asset.color, flagSymbol: '#ffffff' };

    // --- 1. DRAW FLAG POLE & ANIMATED FLAG ---
    const poleX = asset.side === 'LEFT' ? asset.x - 10 : asset.x + 10;
    const poleBaseY = asset.y - 10;
    const poleHeight = 22;
    const poleTopY = poleBaseY - poleHeight;

    // Pole
    this.mainCtx.strokeStyle = '#cccccc';
    this.mainCtx.lineWidth = 2;
    this.mainCtx.beginPath();
    this.mainCtx.moveTo(poleX, poleBaseY);
    this.mainCtx.lineTo(poleX, poleTopY);
    this.mainCtx.stroke();

    // Waving Flag Canvas Math
    const flagWidth = 14;
    const flagHeight = 9;
    const waveOffset = Math.sin(time + asset.x) * 2; // Subtle wave effect
    const flagDirection = asset.side === 'LEFT' ? -1 : 1; // Wave away from center

    this.mainCtx.fillStyle = theme.flagBg;
    this.mainCtx.beginPath();
    this.mainCtx.moveTo(poleX, poleTopY);
    this.mainCtx.lineTo(poleX + (flagWidth * flagDirection), poleTopY + waveOffset);
    this.mainCtx.lineTo(poleX + (flagWidth * flagDirection), poleTopY + flagHeight + waveOffset);
    this.mainCtx.lineTo(poleX, poleTopY + flagHeight);
    this.mainCtx.closePath();
    this.mainCtx.fill();

    // Flag Symbol / Emblem (Inner Accent Circle)
    this.mainCtx.fillStyle = theme.flagSymbol;
    this.mainCtx.beginPath();
    this.mainCtx.arc(
      poleX + (flagWidth * 0.5 * flagDirection), 
      poleTopY + (flagHeight * 0.5) + (waveOffset * 0.5), 
      2, 0, Math.PI * 2
    );
    this.mainCtx.fill();


    // --- 2. DRAW TANK HULL & CANNON BARREL ---
    this.mainCtx.fillStyle = asset.color;
    // Tank Body
    this.mainCtx.fillRect(asset.x - 12, asset.y - 10, 24, 10);

    // Cannon Barrel
    const rad = (asset.angle * Math.PI) / 180;
    this.mainCtx.strokeStyle = '#ffffff';
    this.mainCtx.lineWidth = 3;
    this.mainCtx.beginPath();
    this.mainCtx.moveTo(asset.x, asset.y - 8);
    this.mainCtx.lineTo(asset.x + Math.cos(rad) * 18, asset.y - 8 - Math.sin(rad) * 18);
    this.mainCtx.stroke();

    // Selection Indicator Box
    if (asset === activeAsset) {
      this.mainCtx.strokeStyle = this.mode === MODES.AIMING ? '#ffcc00' : '#00ff88';
      this.mainCtx.lineWidth = 2;
      this.mainCtx.strokeRect(asset.x - 18, asset.y - 32, 36, 38);
    }
  });

  // Render Projectiles & Explosions...
}
      render() {
        this.mainCtx.fillStyle = '#121824';
        this.mainCtx.fillRect(0, 0, this.mainCanvas.width, this.mainCanvas.height);

        this.mainCtx.drawImage(this.terrainCanvas, 0, 0);

        const activeAsset = this.getActiveAsset();
        this.assets.forEach(asset => {
          this.mainCtx.fillStyle = asset.color;

          this.mainCtx.fillRect(asset.x - 12, asset.y - 10, 24, 10);

          const rad = (asset.angle * Math.PI) / 180;
          this.mainCtx.strokeStyle = '#fff';
          this.mainCtx.lineWidth = 3;
          this.mainCtx.beginPath();
          this.mainCtx.moveTo(asset.x, asset.y - 8);
          this.mainCtx.lineTo(asset.x + Math.cos(rad) * 18, asset.y - 8 - Math.sin(rad) * 18);
          this.mainCtx.stroke();

          if (asset === activeAsset) {
            this.mainCtx.strokeStyle = this.mode === MODES.AIMING ? '#ffcc00' : '#00ff88';
            this.mainCtx.lineWidth = 2;
            this.mainCtx.strokeRect(asset.x - 18, asset.y - 20, 36, 26);
          }
        });

        if (this.mode === MODES.AIMING) {
          const rad = (activeAsset.angle * Math.PI) / 180;
          this.mainCtx.strokeStyle = 'rgba(255, 204, 0, 0.4)';
          this.mainCtx.lineWidth = 2;
          this.mainCtx.setLineDash([4, 4]);
          this.mainCtx.beginPath();
          this.mainCtx.moveTo(activeAsset.x, activeAsset.y - 8);
          this.mainCtx.lineTo(
            activeAsset.x + Math.cos(rad) * (activeAsset.power * 0.8),
            activeAsset.y - 8 - Math.sin(rad) * (activeAsset.power * 0.8)
          );
          this.mainCtx.stroke();
          this.mainCtx.setLineDash([]);
        }

        this.projectiles.forEach(p => {
          this.mainCtx.fillStyle = '#ffaa00';
          this.mainCtx.beginPath();
          this.mainCtx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          this.mainCtx.fill();
        });

        this.explosions.forEach(exp => {
          this.mainCtx.fillStyle = `rgba(255, 80, 0, ${Math.max(0, exp.alpha)})`;
          this.mainCtx.beginPath();
          this.mainCtx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
          this.mainCtx.fill();
        });

        constructor(canvasId) {
  this.mainCanvas = document.getElementById(canvasId);
  this.mainCtx = this.mainCanvas.getContext('2d');

  const selectedNation = localStorage.getItem('selectedNation') || 'United States';
  
  const nationTheme = NATION_THEMES[selectedNation] || { color: '#0a84ff', name: selectedNation };
  this.playerNationColor = nationTheme.color;

  this.terrainCanvas = document.createElement('canvas');
  this.terrainCanvas.width = this.mainCanvas.width;
  this.terrainCanvas.height = this.mainCanvas.height;
  this.terrainCtx = this.terrainCanvas.getContext('2d');

  this.playerSide = 'LEFT';
  this.mode = MODES.NAVIGATING;
  this.wind = (Math.random() - 0.5) * 20;

  this.selectedAssetIndex = 0;
  this.projectiles = [];
  this.explosions = [];
  this.keys = {};
  this.lastTime = 0;

  this.generateOffscreenTerrain();

  this.assets = [
    { id: 1, name: `${nationTheme.name} Alpha`, x: 100, y: 100, side: 'LEFT', angle: 45, power: 120, color: this.playerNationColor },
    { id: 2, name: `${nationTheme.name} Bravo`, x: 240, y: 100, side: 'LEFT', angle: 45, power: 130, color: this.playerNationColor },
    { id: 3, name: `${nationTheme.name} Charlie`, x: 380, y: 100, side: 'LEFT', angle: 50, power: 140, color: this.playerNationColor },
    { id: 4, name: 'Enemy Outpost 1', x: 720, y: 100, side: 'RIGHT', angle: 135, power: 120, color: '#ff3b30' },
    { id: 5, name: 'Enemy Outpost 2', x: 860, y: 100, side: 'RIGHT', angle: 135, power: 120, color: '#ff3b30' }
  ];

  this.assets.forEach(a => this.snapAssetToGround(a));

  this.initInput();
  this.updateHUD();
  requestAnimationFrame((ts) => this.loop(ts));
}
      }

      updateHUD() {
        const asset = this.getActiveAsset();
        document.getElementById('side-indicator').textContent = this.playerSide;
        document.getElementById('asset-indicator').textContent = `${asset.name} (Angle: ${Math.round(asset.angle)}° | Power: ${Math.round(asset.power)})`;
        document.getElementById('mode-indicator').textContent = this.mode;
        document.getElementById('wind-indicator').textContent = `${this.wind > 0 ? '→ ' : '← '}${Math.abs(this.wind).toFixed(1)} mph`;
      }

      updateHUD() {
  const asset = this.getActiveAsset();
  
  const sideElem = document.getElementById('side-indicator');
  if (sideElem) {
    sideElem.textContent = `${this.playerSide} (${localStorage.getItem('selectedNation') || 'USA'})`;
    sideElem.style.color = this.playerNationColor; 
  }

  document.getElementById('asset-indicator').textContent = `${asset.name} (Angle: ${Math.round(asset.angle)}° | Power: ${Math.round(asset.power)})`;
  document.getElementById('mode-indicator').textContent = this.mode;
  document.getElementById('wind-indicator').textContent = `${this.wind > 0 ? '→ ' : '← '}${Math.abs(this.wind).toFixed(1)} mph`;
}
      const selectedNation = localStorage.getItem('selectedNation') || 'United States';
const nationTheme = NATION_THEMES[selectedNation] || NATION_THEMES['United States'];

this.assets = [
  { id: 1, name: `${nationTheme.name} Alpha`, x: 100, y: 100, side: 'LEFT', angle: 45, power: 120, color: nationTheme.color, nation: selectedNation },
  { id: 2, name: `${nationTheme.name} Bravo`, x: 240, y: 100, side: 'LEFT', angle: 45, power: 130, color: nationTheme.color, nation: selectedNation },
  { id: 3, name: 'Enemy Outpost 1', x: 720, y: 100, side: 'RIGHT', angle: 135, power: 120, color: '#ff3b30', nation: 'Third Reiche' }
];

      loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        const dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;

        this.update(dt);
        this.render();

        requestAnimationFrame((ts) => this.loop(ts));
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new BattleWarEngine('game-canvas');
    });
  </script>
</body>
</html>
