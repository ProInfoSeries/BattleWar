<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BattleWar Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0d12;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    .hud-bar {
      width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
      background: #181c24;
      padding: 10px 18px;
      border-radius: 6px;
      box-sizing: border-box;
      border: 1px solid #2a3242;
    }

    #game-canvas {
      background-color: #121824;
      border: 2px solid #3a4659;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.9);
    }

    .controls-hint {
      margin-top: 14px;
      font-size: 14px;
      color: #8a9bb8;
    }

    .status-text {
      color: #ffcc00;
    }
  </style>
</head>
<body>

  <div class="hud-bar">
    <div>Side: <span id="side-indicator" style="color: #0a84ff;">LEFT</span></div>
    <div>Active Unit: <span id="asset-indicator" class="status-text">Tank #1</span></div>
    <div>Mode: <span id="mode-indicator" style="color: #00ff88;">SELECTING (WASD)</span></div>
    <div>Wind: <span id="wind-indicator" style="color: #00d2ff;">0.0</span></div>
  </div>

  <canvas id="game-canvas" width="960" height="540"></canvas>

  <div class="controls-hint">
    <strong>[Q]</strong> Toggle Select / Aim Mode &nbsp;|&nbsp; 
    <strong>[WASD in Select Mode]</strong> Switch to asset in that direction &nbsp;|&nbsp; 
    <strong>[WASD in Aim Mode]</strong> Aim angle & power &nbsp;|&nbsp; 
    <strong>[Q in Aim Mode]</strong> Fire!
  </div>

  <script>
    const MODES = { NAVIGATING: 'NAVIGATING', AIMING: 'AIMING', FIRING: 'FIRING' };

    class ScorchedBattleWarEngine {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');

        this.playerSide = 'LEFT';
        this.mode = MODES.NAVIGATING;
        this.wind = (Math.random() - 0.5) * 15; 
        this.terrain = [];
        this.generateTerrain();
        this.assets = [
          { id: 1, name: 'Tank Alpha', x: 100, y: 0, side: 'LEFT', angle: 45, power: 60, color: '#0a84ff' },
          { id: 2, name: 'Tank Bravo', x: 220, y: 0, side: 'LEFT', angle: 45, power: 65, color: '#0a84ff' },
          { id: 3, name: 'Artillery Charlie', x: 340, y: 0, side: 'LEFT', angle: 50, power: 70, color: '#0a84ff' },
          { id: 4, name: 'Enemy Outpost 1', x: 700, y: 0, side: 'RIGHT', angle: 135, power: 60, color: '#ff3b30' },
          { id: 5, name: 'Enemy Outpost 2', x: 840, y: 0, side: 'RIGHT', angle: 135, power: 60, color: '#ff3b30' }
        ];

        this.assets.forEach(a => {
          a.y = this.terrain[Math.floor(a.x)];
        });

        this.selectedAssetIndex = 0;
        this.projectiles = [];
        this.explosions = [];
        this.keys = {};
        this.lastTime = 0;

        this.initInput();
        this.updateHUD();
        requestAnimationFrame((ts) => this.loop(ts));
      }

      generateTerrain() {
        for (let x = 0; x <= this.canvas.width; x++) {
          let height = 380 
            + Math.sin(x * 0.008) * 50 
            + Math.sin(x * 0.02) * 20;
          this.terrain[x] = height;
        }
      }

      initInput() {
        window.addEventListener('keydown', (e) => {
          this.keys[e.code] = true;

          if (e.code === 'KeyQ') {
            this.handleQPress();
          }

          if (this.mode === MODES.NAVIGATING && ['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
            this.navigateAssetDirectionally(e.code);
          }
        });

        window.addEventListener('keyup', (e) => {
          this.keys[e.code] = false;
        });
      }

      handleQPress() {
        if (this.mode === MODES.NAVIGATING) {
          this.mode = MODES.AIMING;
        } else if (this.mode === MODES.AIMING) {
          this.fireActiveAsset();
          this.mode = MODES.FIRING;
        }
      }


      navigateAssetDirectionally(keyCode) {
        const current = this.getActiveAsset();
        const playerAssets = this.assets.filter(a => a.side === this.playerSide);

        let bestMatch = null;
        let minDistance = Infinity;

        playerAssets.forEach(candidate => {
          if (candidate === current) return;

          const dx = candidate.x - current.x;
          const dy = candidate.y - current.y; 

          let isMatch = false;
          if (keyCode === 'KeyD' && dx > 20) isMatch = true;     
          if (keyCode === 'KeyA' && dx < -20) isMatch = true;     
          if (keyCode === 'KeyW' && dy < -10) isMatch = true;      
          if (keyCode === 'KeyS' && dy > 10) isMatch = true;       

          if (isMatch) {
            const dist = Math.hypot(dx, dy);
            if (dist < minDistance) {
              minDistance = dist;
              bestMatch = candidate;
            }
          }
        });

        if (bestMatch) {
          this.selectedAssetIndex = playerAssets.indexOf(bestMatch);
        }
      }

      getActiveAsset() {
        const playerAssets = this.assets.filter(a => a.side === this.playerSide);
        return playerAssets[this.selectedAssetIndex] || playerAssets[0];
      }

      fireActiveAsset() {
        const asset = this.getActiveAsset();
        const rad = (asset.angle * Math.PI) / 180;
        const velocity = asset.power * 3.5;

        this.projectiles.push({
          x: asset.x,
          y: asset.y - 12,
          vx: Math.cos(rad) * velocity,
          vy: -Math.sin(rad) * velocity 
        });
      }

      update(dt) {
        const currentAsset = this.getActiveAsset();

        if (this.mode === MODES.AIMING) {
          if (this.keys['KeyW']) currentAsset.angle = Math.min(360, currentAsset.angle + 30 * dt);
          if (this.keys['KeyS']) currentAsset.angle = Math.max(0, currentAsset.angle - 30 * dt);
          if (this.keys['KeyD']) currentAsset.power = Math.min(250, currentAsset.power + 25 * dt);
          if (this.keys['KeyA']) currentAsset.power = Math.max(10, currentAsset.power - 25 * dt);
        }

        const gravity = 120; 
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          let p = this.projectiles[i];

          p.vx += this.wind * dt; 
          p.vy += gravity * dt;  

          p.x += p.vx * dt;
          p.y += p.vy * dt;

          const terrainY = this.terrain[Math.floor(p.x)] || 600;
          if (p.y >= terrainY || p.x < 0 || p.x > this.canvas.width) {
            if (p.x >= 0 && p.x <= this.canvas.width) {
              const blastRadius = 25;
              this.explosions.push({ x: p.x, y: terrainY, radius: 4, alpha: 1 });
              this.deformTerrain(p.x, terrainY, blastRadius);
            }
            this.projectiles.splice(i, 1);
            this.mode = MODES.NAVIGATING; 
          }
        }

        for (let i = this.explosions.length - 1; i >= 0; i--) {
          let exp = this.explosions[i];
          exp.radius += 50 * dt;
          exp.alpha -= 1.5 * dt;
          if (exp.alpha <= 0) this.explosions.splice(i, 1);
        }

        this.updateHUD();
      }

      render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.fillStyle = '#3d2817';
        this.ctx.beginPath();
        this.ctx.moveTo(0, this.canvas.height);
        for (let x = 0; x <= this.canvas.width; x++) {
          this.ctx.lineTo(x, this.terrain[x]);
        }
        this.ctx.lineTo(this.canvas.width, this.canvas.height);
        this.ctx.fill();
        this.ctx.strokeStyle = '#4e782e';
        this.ctx.lineWidth = 4;
        this.ctx.beginPath();
        for (let x = 0; x <= this.canvas.width; x++) {
          this.ctx.lineTo(x, this.terrain[x]);
        }
        this.ctx.stroke();

        const activeAsset = this.getActiveAsset();
        this.assets.forEach(asset => {
          this.ctx.fillStyle = asset.color;

          this.ctx.fillRect(asset.x - 12, asset.y - 10, 24, 10);
          const rad = (asset.angle * Math.PI) / 180;
          this.ctx.strokeStyle = '#fff';
          this.ctx.lineWidth = 3;
          this.ctx.beginPath();
          this.ctx.moveTo(asset.x, asset.y - 8);
          this.ctx.lineTo(asset.x + Math.cos(rad) * 18, asset.y - 8 - Math.sin(rad) * 18);
          this.ctx.stroke();
          if (asset === activeAsset) {
            this.ctx.strokeStyle = this.mode === MODES.AIMING ? '#ffcc00' : '#00ff88';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(asset.x - 18, asset.y - 20, 36, 26);
          }
        });

        if (this.mode === MODES.AIMING) {
          const rad = (activeAsset.angle * Math.PI) / 180;
          this.ctx.strokeStyle = 'rgba(255, 204, 0, 0.4)';
          this.ctx.lineWidth = 2;
          this.ctx.setLineDash([4, 4]);
          this.ctx.beginPath();
          this.ctx.moveTo(activeAsset.x, activeAsset.y - 8);
          this.ctx.lineTo(
            activeAsset.x + Math.cos(rad) * activeAsset.power, 
            activeAsset.y - 8 - Math.sin(rad) * activeAsset.power
          );
          this.ctx.stroke();
          this.ctx.setLineDash([]);
        }

        this.projectiles.forEach(p => {
          this.ctx.fillStyle = '#ffaa00';
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          this.ctx.fill();
        });

        this.explosions.forEach(exp => {
          this.ctx.fillStyle = `rgba(255, 80, 0, ${Math.max(0, exp.alpha)})`;
          this.ctx.beginPath();
          this.ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
          this.ctx.fill();
        });
      }

      deformTerrain(explosionX, explosionY, radius) {
        const startX = Math.max(0, Math.floor(explosionX - radius));
        const endX = Math.min(this.canvas.width, Math.ceil(explosionX + radius));
        const maxDepthY = this.canvas.height - 50;

          for (let x = startX; x <= endX; x++) {
            const dx = x - explosionX;
    
          if (Math.abs(dx) <= radius) {
            const currentSurfaceY = this.terrain[x];

        const halfHeight = Math.sqrt(radius * radius - dx * dx);
        const explosionTopY = explosionY - halfHeight;
        const explosionBottomY = explosionY + halfHeight;

          if (currentSurfaceY <= explosionBottomY && currentSurfaceY >= explosionTopY - 10) {
            const newHeight = Math.max(currentSurfaceY, explosionBottomY);
            this.terrain[x] = Math.min(newHeight, maxDepthY);
      }
    }
  }

  this.updateAssetHeights();
}

      updateAssetHeights() {
  this.assets.forEach(asset => {
    const currentGroundY = this.terrain[Math.floor(asset.x)];
    
    if (asset.y < currentGroundY) {
      asset.y = currentGroundY;
    }
  });
}

      updateHUD() {
        const asset = this.getActiveAsset();
        document.getElementById('side-indicator').textContent = this.playerSide;
        document.getElementById('asset-indicator').textContent = `${asset.name} (Angle: ${Math.round(asset.angle)}° | Power: ${Math.round(asset.power)})`;
        document.getElementById('mode-indicator').textContent = this.mode;
        document.getElementById('wind-indicator').textContent = `${this.wind > 0 ? '→ ' : '← '}${Math.abs(this.wind).toFixed(1)} mph`;
      }

      loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        const dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;

        this.update(dt);
        this.render();

        requestAnimationFrame((ts) => this.loop(ts));
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new ScorchedBattleWarEngine('game-canvas');
    });
  </script>
  <script src="gamephysics.js"></script>
</body>
</html>
